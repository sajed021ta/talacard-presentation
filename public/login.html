<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e7c569"><title>ورود · طلاکارت</title><link rel="stylesheet" href="/access.css"><script type="module" src="/login.js"></script></head>
<body class="login-page"><main class="login-layout">
 <div class="login-brand"><img src="/media/talacard-logo.png" alt="نشان طلاکارت"><span>طلاکارت</span></div>
 <section class="login-card" aria-labelledby="login-heading"><p class="login-eyebrow">طلاکارت، جریان طلا</p><h1 id="login-heading">به ارائه خوش آمدید</h1><p class="login-intro">با نام کاربری و رمز عبور خود وارد شوید.</p>
  <form id="login-form"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required maxlength="64">
   <label for="password">رمز عبور</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="256"><button type="button" id="show-password" aria-label="نمایش رمز عبور" aria-pressed="false">نمایش</button></div>
   <p id="login-error" class="login-error" role="alert" hidden></p><button type="submit" id="login-submit">ورود به پرزنتیشن <span aria-hidden="true">←</span></button>
  </form><p class="login-note">دسترسی مشاهده یا ویرایش، متناسب با حساب شما فعال می‌شود.</p>
 </section><p class="login-footer">ارائهٔ طلاکارت</p>
</main></body></html>
