<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222225"><meta name="description" content="ارائهٔ طلاکارت و پیشنهاد همکاری؛ خرید، فروش و دریافت فیزیکی طلا"><title>ارائهٔ طلاکارت</title><link rel="stylesheet" href="viewer.css"><script type="module" src="viewer.js"></script></head><body>
<header class="toolbar"><a class="brand" href="/" aria-label="ارائهٔ طلاکارت"><svg viewBox="0 0 30 32" aria-hidden="true"><path d="M20 2v20H9v7H2V16h10V2M27 2v27H16v-7"/></svg><span>طلاکارت<small>نمایش ارائه</small></span></a><label class="deck-picker"><span class="sr-only">انتخاب ارائه</span><select id="deck-select"></select></label><span class="viewer-note">برای شروع، پخش را بزنید.</span></header>
<main class="workspace"><div class="preview-column"><div class="preview-heading"><span>خرید، فروش و دریافت فیزیکی طلا</span><div><button id="restart" class="text-button">از ابتدا</button><button id="fullscreen" class="icon-button" aria-label="نمایش تمام‌صفحه"></button></div></div><section id="stage" class="stage" aria-label="نمایش ارائه"><div id="scene-canvas" class="scene-canvas"></div></section>
<div class="player" role="group" aria-label="کنترل پخش"><button id="prev" class="icon-button" aria-label="صفحهٔ قبل"></button><button id="play" class="icon-button play-button" aria-label="پخش"></button><button id="next" class="icon-button" aria-label="صفحهٔ بعد"></button><div id="chapter-progress" class="chapter-progress"></div><span id="clock" class="clock" dir="ltr"></span></div><div class="scrub-row"><label class="sr-only" for="seek">زمان صفحهٔ فعلی</label><input id="seek" type="range" min="0" max="1000" value="0"><span id="scene-clock" dir="ltr"></span></div>
<section class="flow"><div class="flow-heading"><h2>فلو</h2><span id="flow-count"></span></div><p id="flow-description"></p><div id="flow-grid"></div></section></div></main><div id="toast" class="toast" role="status" hidden></div></body></html>
