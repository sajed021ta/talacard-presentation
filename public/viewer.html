<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222225"><meta name="description" content="ارائهٔ طلاکارت و پیشنهاد همکاری؛ خرید، فروش و دریافت فیزیکی طلا"><title>ارائهٔ طلاکارت</title><link rel="stylesheet" href="viewer.css"><script type="module" src="viewer.js"></script></head><body>
<header class="toolbar"><a class="brand" href="/" aria-label="ارائهٔ طلاکارت"><img class="brand-logo" src="/media/talacard-logo.png" alt=""><span>طلاکارت</span></a><label class="deck-picker"><span class="sr-only">انتخاب ارائه</span><select id="deck-select"></select></label><span class="viewer-note">صفحهٔ بعد را با دکمهٔ بعدی انتخاب کنید.</span></header>
<main class="workspace"><aside class="scene-sidebar" aria-label="بخش‌های ارائه"><div class="rail-heading"><h1>بخش‌ها <span id="page-count"></span></h1></div><nav id="chapter-list" aria-label="دسته‌های ارائه"></nav><div class="rail-footer">زیرصفحه‌های هر بخش بالای ارائه‌اند.</div></aside><div class="preview-column"><nav id="page-tabs" class="page-tabs" aria-label="صفحه‌های بخش فعلی"></nav><div class="preview-heading"><span id="scene-heading" aria-live="polite"></span><div><button id="restart" class="text-button">از ابتدا</button><button id="fullscreen" class="icon-button" aria-label="نمایش تمام‌صفحه"></button></div></div><section id="stage" class="stage" aria-label="نمایش ارائه"><div id="scene-canvas" class="scene-canvas"></div></section>
<div class="player" role="group" aria-label="کنترل پخش"><button id="prev" class="icon-button" aria-label="صفحهٔ قبل"></button><button id="play" class="icon-button play-button" aria-label="پخش"></button><button id="next" class="icon-button" aria-label="صفحهٔ بعد"></button><span id="page-location" class="page-location"></span><label class="loop-control"><input id="loop-video" type="checkbox"> تکرار ویدیو</label></div>
</div></main><div id="toast" class="toast" role="status" hidden></div></body></html>
