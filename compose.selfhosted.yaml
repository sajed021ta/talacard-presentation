name: talacard-presentation-backend
services:
  presentation:
    build: .
    image: talacard-presentation:selfhosted
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${TALACARD_BIND_PORT:-4187}:4187"
    environment:
      NODE_ENV: production
      TALACARD_MODE: self-hosted
      TALACARD_PUBLIC_URL: "${TALACARD_PUBLIC_URL:-https://presentation.talacard.com}"
      TALACARD_DATA_DIR: /data
      TALACARD_PORT: "4187"
      TALACARD_HOST: 0.0.0.0
      TALACARD_SESSION_SECONDS: "${TALACARD_SESSION_SECONDS:-28800}"
      TALACARD_TRUST_PROXY: "1"
      TALACARD_TRUSTED_PROXIES: "${TALACARD_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}"
    volumes:
      - presentation_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4187/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    stop_grace_period: 30s
volumes:
  presentation_data:
    name: talacard_presentation_selfhost_v1
